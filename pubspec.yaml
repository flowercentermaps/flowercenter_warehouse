name: flowercenter_warehouse
description: "Flower Center Warehouse Manager App"
publish_to: 'none'
version: 2.6.1+10


environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  supabase_flutter: ^2.8.4
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^13.1.0
  path_provider: ^2.1.4
  intl: ^0.20.2
  local_notifier: ^0.1.6
  firebase_core: ^4.6.0
  firebase_messaging: ^16.1.3
  flutter_local_notifications: ^18.0.1
  logger: ^2.7.0
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  mobile_scanner: ^5.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  windows:
    generate: true
    image_path: "assets/icon.png"
    icon_size: 48
  image_path: "assets/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/

  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
